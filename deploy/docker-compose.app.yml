# ─── Stack APPLICATION — frontend + backend, base PostgreSQL externe (Portainer) ─
#
# Portainer → environnement de la machine application → Stacks → Add stack →
# Web editor : coller ce fichier, renseigner les variables, « Deploy the stack ».
# À déployer APRÈS la stack base de données (deploy/docker-compose.db.yml).
#
# Variables (section « Environment variables » de la stack) :
#   APP_IMAGE_TAG      étiquette de l'image à déployer : un numéro de version en production (ex. 1.0.0), main en recette (voir « Publier une version » dans README.md)
#   ENCRYPTION_KEY     hexadécimal 32 octets  ⚠️ NE CHANGE JAMAIS (reprendre l'ancienne valeur si reprise de données)
#   JWT_SECRET         hexadécimal 32 octets  différent d'ENCRYPTION_KEY
#   APP_DB_PASSWORD    même valeur que dans la stack base de données
#   DB_HOST            IP ou nom DNS de la machine base
#   DB_PORT            optionnel, défaut 5432
#   FRONTEND_URL       URL publique HTTPS sans slash final (ex. https://bons.peduzzi.local)
#   FRONTEND_PORT      optionnel, défaut 5147 (port publié pour le reverse proxy)
#   FRONTEND_BIND      optionnel, 127.0.0.1 si le reverse proxy tourne sur la même machine
#   DATA_VOLUME_NAME   optionnel, défaut bons_app_data (reprise de données : nom de l'ancien volume data)
#   DEFAULT_ADMIN_PASSWORD   optionnel (sinon généré dans /app/data/initial-admin-password.txt)
#   BACKUP_RETENTION_DAYS    optionnel, défaut 14
#   BACKUP_INTERVAL_SECONDS  optionnel, défaut 86400
#
# Mise à jour : Portainer → Stack → « Pull and redeploy » (les migrations Prisma
# s'appliquent au démarrage du backend).

services:

  # ── Backend NestJS ───────────────────────────────────────────────────────────
  backend:
    image: "ghcr.io/l4curtis/bonmiseadisposition-backend:${APP_IMAGE_TAG:?APP_IMAGE_TAG manquant : un numéro de version en production (ex. 1.0.0), main en recette}"
    container_name: bons-backend
    restart: unless-stopped
    environment:
      # Mot de passe hexadécimal : aucun caractère à encoder dans l'URL.
      # sslmode=require : connexion chiffrée vers la machine base (certificat auto-signé accepté).
      DATABASE_URL: "postgresql://app:${APP_DB_PASSWORD:?APP_DB_PASSWORD manquant}@${DB_HOST:?DB_HOST manquant}:${DB_PORT:-5432}/bons_disposition?sslmode=require&connect_timeout=10"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY manquant}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL manquant}
    volumes:
      - data:/app/data
      # Export SMB des PDF : décommenter avec le volume smb_export plus bas, puis
      # Admin → Configuration → Export SMB : chemin = /mnt/export
      # - smb_export:/mnt/export
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Frontend React (nginx) — exposé pour le reverse proxy ────────────────────
  frontend:
    image: "ghcr.io/l4curtis/bonmiseadisposition-frontend:${APP_IMAGE_TAG:?APP_IMAGE_TAG manquant : un numéro de version en production (ex. 1.0.0), main en recette}"
    container_name: bons-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-5147}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128m

  # ── Sauvegarde quotidienne du volume data (images de signature, pièces jointes) ─
  data-backup:
    image: alpine:3.20
    container_name: bons-data-backup
    restart: unless-stopped
    volumes:
      - data:/data:ro
      - data_backups:/backups
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          f="/backups/data-$$(date +%Y%m%d-%H%M).tar.gz"
          if tar czf "$$f.tmp" -C / data; then
            mv "$$f.tmp" "$$f"
            echo "Sauvegarde OK : $$f ($$(du -h "$$f" | cut -f1))"
          else
            rm -f "$$f.tmp"
            echo "ÉCHEC de la sauvegarde du volume data" >&2
          fi
          find /backups -name 'data-*.tar.gz' -mtime +${BACKUP_RETENTION_DAYS:-14} -delete
          sleep ${BACKUP_INTERVAL_SECONDS:-86400}
        done

volumes:
  # Fichiers chiffrés : inexploitables sans la base ET l'ENCRYPTION_KEY.
  data:
    name: ${DATA_VOLUME_NAME:-bons_app_data}
  # Sauvegardes : par défaut un volume local ; pour un partage réseau, remplacer par
  # un volume CIFS (même syntaxe que smb_export ci-dessous, autre dossier).
  data_backups:
    name: bons_data_backups
  # smb_export:
  #   driver: local
  #   driver_opts:
  #     type: cifs
  #     device: "//serveur/partage/BONS"
  #     o: "username=${SMB_USER},password=${SMB_PASSWORD},domain=peduzzi.local,vers=3.0,uid=1001,gid=1001,file_mode=0660,dir_mode=0770"

networks:
  internal:
    driver: bridge
