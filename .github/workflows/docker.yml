name: Build & Push Docker images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Les tests backend et frontend conditionnent le build : un push sur main part
  # en recette (étiquette `main`), un tag `vX.Y.Z` prépare une mise en production
  # manuelle (voir deploy/README.md « Publier une version ») ; dans les deux cas,
  # le build ne doit jamais embarquer une suite de tests rouge, un typage en
  # échec ou un schéma Prisma en dérive par rapport aux migrations appliquées.
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # Base jetable dédiée à la CI (mot de passe fixe « ci », sans rapport avec
      # la base de dev) : mêmes réglages que docker-compose.dev.yml (nom de
      # base, utilisateur, fuseau UTC) pour reproduire fidèlement le comportement
      # des requêtes SQL brutes ($queryRaw) en production.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bons_disposition
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d bons_disposition"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app:ci@localhost:5432/bons_disposition
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Valider le schéma Prisma
        working-directory: ./backend
        run: npx prisma validate

      - name: Appliquer les migrations
        working-directory: ./backend
        run: npx prisma migrate deploy

      - name: Détection de dérive schema.prisma / migrations
        working-directory: ./backend
        # « migrate diff --exit-code » sort en 2 quand schema.prisma diverge des
        # migrations appliquées (modèle modifié sans migration créée) : on le
        # distingue d'une vraie erreur de commande pour un message explicite.
        run: |
          set +e
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error::schema.prisma diverge des migrations appliquées. Générez la migration manquante avec « npx prisma migrate dev » avant de pousser sur main." >&2
            exit 1
          elif [ "$code" -ne 0 ]; then
            echo "::error::échec de « prisma migrate diff » (code $code) — voir les logs ci-dessus." >&2
            exit "$code"
          fi

      - name: Type-check backend
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Tests backend avec couverture
        working-directory: ./backend
        run: npm run test:cov

      - name: Tests SQL contre une vraie base (filet $queryRaw)
        working-directory: ./backend
        # Les specs unitaires simulent $queryRaw et ne voient donc jamais les
        # erreurs que seul Postgres détecte (casts d'enum, GROUP BY, fuseau) :
        # voir backend/src/__tests__/sql-real-db.spec.ts. Base vide suffisante.
        # Toutes les suites « real-db » (et pas un fichier nommé) : une nouvelle
        # suite ajoutée ailleurs ne doit pas être oubliée silencieusement par la CI.
        run: RUN_DB_TESTS=1 npx jest --testPathPatterns 'real-db'

      - name: Audit de sécurité (non bloquant)
        working-directory: ./backend
        # Non bloquant : des vulnérabilités « high » subsistent tant que la
        # montée de version majeure correspondante n'est pas faite. On les
        # garde visibles dans les logs sans casser la CI.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: ./frontend
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Tests frontend (Vitest)
        working-directory: ./frontend
        run: npx vitest run

      - name: Build frontend (Vite)
        working-directory: ./frontend
        run: npx vite build

      - name: Audit de sécurité (non bloquant)
        working-directory: ./frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # Tests de bout en bout (Playwright) contre l'application construite depuis
  # les sources (mêmes Dockerfiles que build-and-push, voir e2e/README ci-
  # dessous) : la régression « cachet IT refusé sur un brouillon » n'avait été
  # vue que par un scénario navigateur écrit hors du dépôt — voir
  # docs/testing-guide.md (section E2E).
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Installer les dépendances E2E
        working-directory: ./e2e
        run: npm ci

      - name: Installer Chromium (Playwright)
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Démarrer la compose E2E (build depuis les sources)
        working-directory: ./e2e
        run: docker compose -p bmad-e2e -f docker-compose.e2e.yml up -d --build

      - name: Attendre /api/health/ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/api/health/ready > /dev/null 2>&1; then
              echo "Backend prêt (/api/health/ready)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::/api/health/ready n'a jamais répondu 200 après 120s" >&2
          docker compose -p bmad-e2e -f e2e/docker-compose.e2e.yml logs --no-color
          exit 1

      - name: Amorcer les données E2E
        run: bash e2e/seed/seed.sh bmad-e2e

      - name: Lancer les tests Playwright (Chromium)
        working-directory: ./e2e
        run: npx playwright test

      - name: Publier le rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Arrêter et supprimer la compose E2E
        if: always()
        run: docker compose -p bmad-e2e -f e2e/docker-compose.e2e.yml down -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Convertit le owner en lowercase (Docker exige des noms d'images en minuscules)
      - name: Set lowercase image names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${OWNER}/bonmiseadisposition-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER}/bonmiseadisposition-frontend" >> $GITHUB_ENV

      # APP_VERSION : le numéro de version sans le « v » sur un tag `vX.Y.Z`,
      # `main` sinon. APP_COMMIT : le sha complet. Ces deux build-args sont
      # attendus par les Dockerfiles (backend et frontend).
      - name: Déterminer la version et le commit publiés
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "app_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=main" >> "$GITHUB_OUTPUT"
          fi
          echo "app_commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ──────────────────────────────────────────────────────────────
      # Étiquettes : sur main, `main` + `sha-<sha complet>` + `<sha complet>`
      # (format actuel, conservé pour continuité) + `latest` (alias de main, à
      # retirer une fois les stacks migrées — voir deploy/README.md) ; sur un tag
      # `vX.Y.Z`, `X.Y.Z` et `X.Y` (sans le « v »).
      - name: Métadonnées de l'image backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          # NB: la clé correcte est `file:` (`dockerfile:` était ignoré en silence)
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            APP_COMMIT=${{ steps.version.outputs.app_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ─────────────────────────────────────────────────────────────
      # Mêmes règles d'étiquettes que le backend, voir commentaire ci-dessus.
      - name: Métadonnées de l'image frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            APP_COMMIT=${{ steps.version.outputs.app_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Images publiées ✅"
            echo ""
            echo "**Backend** (\`${{ env.BACKEND_IMAGE }}\`)"
            echo '${{ steps.meta-backend.outputs.tags }}' | sed -e 's/^/- `/' -e 's/$/`/'
            echo ""
            echo "**Frontend** (\`${{ env.FRONTEND_IMAGE }}\`)"
            echo '${{ steps.meta-frontend.outputs.tags }}' | sed -e 's/^/- `/' -e 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
