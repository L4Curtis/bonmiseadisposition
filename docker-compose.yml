# ─── Pile complète construite depuis les sources, sur le poste ───────────────
#
# Pour essayer localement les images telles qu'elles seront construites
# (nginx du frontend compris) : http://localhost:3000. Ce n'est ni la pile de
# développement (docker-compose.dev.yml : base et Mailpit, backend et frontend
# lancés par npm) ni une installation de production (deploy/README.md).
#
# Variables lues dans .env (modèle : .env.example) : POSTGRES_PASSWORD,
# ENCRYPTION_KEY, JWT_SECRET, DEFAULT_ADMIN_PASSWORD.
#
#   docker compose up -d --build      puis      docker compose down

# Nom de projet propre : sans lui, Compose reprendrait celui du dossier, déjà
# utilisé par docker-compose.dev.yml, et remplacerait la base de dev.
name: bons-local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bons_disposition
      # Fuseau explicite : les indicateurs KPI comparent des timestamps UTC ; ne pas modifier.
      TZ: UTC
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-devpassword}@db:5432/bons_disposition
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY manquant dans .env (openssl rand -hex 32)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env (openssl rand -hex 32, différent de ENCRYPTION_KEY)}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      NODE_ENV: development
      # Adresse de cette pile : liens des emails et retour du SSO.
      FRONTEND_URL: http://localhost:3000
    volumes:
      - data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      # Le préfixe global rend la route /api/health (et non /health) — un
      # mauvais chemin laissait le backend unhealthy et bloquait le frontend
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    ports:
      # Boucle locale seulement : joint en direct, sans reverse proxy, ce port
      # laisserait un autre poste choisir l'adresse IP enregistrée (en-tête
      # X-Real-IP) et circuler en HTTP clair.
      - "127.0.0.1:3000:8080"

volumes:
  pgdata:
  data:

networks:
  internal:
    driver: bridge
