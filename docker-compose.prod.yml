# ─── Production — images pré-buildées depuis ghcr.io ────────────────────────
#
# Portainer → Stacks → Add Stack → Repository → docker-compose.prod.yml
#
# Variables à renseigner (dans Portainer ou .env) :
#   ENCRYPTION_KEY    = openssl rand -hex 32
#   JWT_SECRET        = openssl rand -hex 32  (DOIT être différent de ENCRYPTION_KEY)
#   POSTGRES_PASSWORD = openssl rand -base64 24
#   FRONTEND_URL      = https://bons.groupelivio.local
#   FRONTEND_PORT     = 5147  (optionnel, défaut 5147)
#   FRONTEND_BIND     = 127.0.0.1 si NPM tourne sur la même machine (recommandé :
#                       évite l'accès HTTP direct en clair qui contournerait NPM
#                       et permettrait de forger X-Real-IP). Défaut 0.0.0.0.
#
# Mise à jour : Portainer → Stack → "Pull and redeploy"

services:

  # ── Base de données PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bons_disposition
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bons_disposition"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Backend NestJS ───────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/l4curtis/bonmiseadisposition-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/bons_disposition
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Frontend React — exposé sur le port hôte pour NPM ──────────────────────
  frontend:
    image: ghcr.io/l4curtis/bonmiseadisposition-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-5147}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  pgdata:
  data:

networks:
  internal:
    driver: bridge
