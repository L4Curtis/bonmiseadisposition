# ─── Production — SSL géré par Nginx Proxy Manager externe ──────────────────
#
# Usage :
#   cp .env.example .env && nano .env   # renseigner les 3 secrets
#   docker compose -f docker-compose.prod.yml up -d
#
# Nginx Proxy Manager : pointer sur http://<host>:5147
# Le frontend (port 5147) proxifie /api/* vers le backend en interne.
# Le backend et la base ne sont PAS exposés sur le réseau hôte.

services:

  # ── Base de données PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bons_disposition
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Backend NestJS ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/bons_disposition
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Frontend React — exposé sur le port hôte pour NPM ──────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5147}:80"   # Changer via variable FRONTEND_PORT dans Portainer (défaut: 5147)
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  pgdata:
  data:

networks:
  internal:
    driver: bridge
