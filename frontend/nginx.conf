# ─── Adresse IP du client ─────────────────────────────────────────────────────
# L'adresse retenue ici est transmise au backend dans X-Real-IP et
# X-Forwarded-For, tous deux ÉCRASÉS (jamais $proxy_add_x_forwarded_for, qui
# recopierait la valeur envoyée par le client). C'est elle que l'application
# enregistre sur une signature et dans le journal d'audit, et celle que compte
# la limitation de débit. Ordre de confiance :
#   1) CF-Connecting-IP, SEULEMENT si le conteneur est lancé avec
#      TRUST_CF_CONNECTING_IP=1 (derrière Cloudflare, et tests E2E). Sans
#      l'option, l'en-tête est ignoré. Le choix est écrit au démarrage dans le
#      fichier inclus ci-dessous par docker/40-client-ip.sh.
#   2) X-Real-IP, posé par le reverse proxy (Nginx Proxy Manager y met
#      l'adresse de la connexion du poste, en écrasant celle qu'enverrait le
#      client, À CONDITION d'avoir le bloc Advanced de deploy/README.md § 4 :
#      sans sa ligne set_real_ip_from, NPM reprend le X-Real-IP d'un poste
#      du réseau local).
#   3) $remote_addr, l'adresse de la connexion, quand rien d'autre n'est cru.
# Une valeur qui n'a pas la forme d'une adresse IPv4 (quatre nombres séparés
# par des points) ou IPv6 (chiffres hexadécimaux et au moins un « : ») est
# écartée, comme un texte libre ou une liste de plusieurs adresses : on passe
# alors à la source suivante.
#
# Condition de confiance : un client qui joint ce conteneur EN DIRECT choisit
# librement X-Real-IP (et CF-Connecting-IP si l'option est active), donc
# l'adresse enregistrée sur ses signatures. Le conteneur ne doit être
# joignable QUE par le reverse proxy : aucun port publié, réseau Docker du
# proxy (deploy/README.md, « Reverse proxy »).
map $http_x_real_ip $x_real_ip_valide {
    "~^([0-9]{1,3}\.){3}[0-9]{1,3}$"               $http_x_real_ip;
    "~^(?=.{2,45}$)[0-9A-Fa-f.]*:[0-9A-Fa-f:.]*$"  $http_x_real_ip;
    default                                        "";
}
map $http_cf_connecting_ip $cf_connecting_ip_valide {
    "~^([0-9]{1,3}\.){3}[0-9]{1,3}$"               $http_cf_connecting_ip;
    "~^(?=.{2,45}$)[0-9A-Fa-f.]*:[0-9A-Fa-f:.]*$"  $http_cf_connecting_ip;
    default                                        "";
}
# Définit $cf_connecting_ip_retenu : $cf_connecting_ip_valide si l'option est
# active, vide sinon.
include /etc/nginx/client-ip/cf-connecting-ip.conf;

map $cf_connecting_ip_retenu $client_ip_proxy {
    ""      $x_real_ip_valide;
    default $cf_connecting_ip_retenu;
}
map $client_ip_proxy $client_real_ip {
    ""      $remote_addr;
    default $client_ip_proxy;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Z3x2+QkXC//7xJ/LmLpx2aSNwTY1uPNk5cFqW4/xsqQ='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; form-action 'self';" always;

    # Aligné sur la limite JSON du backend (2 Mo, signatures base64 incluses) —
    # le défaut nginx (1 Mo) rejetait les signatures volumineuses en 413
    client_max_body_size 2m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA routing. Cache-Control no-store sur le shell HTML : sans lui, un
    # navigateur peut garder un index.html périmé pointant vers d'anciens
    # bundles après un redéploiement (les assets hashés, eux, sont immuables).
    # NB héritage nginx : add_header local annule ceux du bloc server → les
    # headers de sécurité sont re-déclarés ici.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Z3x2+QkXC//7xJ/LmLpx2aSNwTY1uPNk5cFqW4/xsqQ='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; form-action 'self';" always;
    }

    # Proxy API to backend
    # Use variable + resolver to force DNS re-resolution (Docker embedded DNS: 127.0.0.11)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:4000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Un add_header local annule l'héritage des headers du bloc server :
        # re-déclarer ceux qui restent pertinents pour des assets statiques
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
