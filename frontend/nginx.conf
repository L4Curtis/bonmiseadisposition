# Chaîne IP client (SEC-03) — ordre de confiance :
#   1) CF-Connecting-IP : posé par Cloudflare (tunnel cloudflared) = IP réelle du
#      visiteur. C'est le cas de ce déploiement.
#   2) X-Real-IP : posé par un reverse proxy type Nginx Proxy Manager (autre setup).
#   3) $remote_addr : accès direct sans proxy (fallback).
# X-Real-IP/X-Forwarded-For sont ÉCRASÉS avec cette valeur (jamais
# $proxy_add_x_forwarded_for, qui concatène le header forgeable du client).
#
# ⚠️ Prérequis de confiance : le port publié de ce conteneur ne doit être
# joignable QUE par le tunnel/proxy (cf. FRONTEND_BIND=127.0.0.1 si cloudflared
# tourne sur la même VM) — sinon un client direct sur le LAN pourrait forger
# CF-Connecting-IP / X-Real-IP.
map $http_cf_connecting_ip $real_ip_step1 {
    ""      $http_x_real_ip;   # pas de Cloudflare → tenter X-Real-IP
    default $http_cf_connecting_ip;
}
map $real_ip_step1 $client_real_ip {
    ""      $remote_addr;      # ni Cloudflare ni X-Real-IP → connexion directe
    default $real_ip_step1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Z3x2+QkXC//7xJ/LmLpx2aSNwTY1uPNk5cFqW4/xsqQ='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; form-action 'self';" always;

    # Aligné sur la limite JSON du backend (2 Mo, signatures base64 incluses) —
    # le défaut nginx (1 Mo) rejetait les signatures volumineuses en 413
    client_max_body_size 2m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA routing. Cache-Control no-store sur le shell HTML : sans lui, un
    # navigateur peut garder un index.html périmé pointant vers d'anciens
    # bundles après un redéploiement (les assets hashés, eux, sont immuables).
    # NB héritage nginx : add_header local annule ceux du bloc server → les
    # headers de sécurité sont re-déclarés ici.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Z3x2+QkXC//7xJ/LmLpx2aSNwTY1uPNk5cFqW4/xsqQ='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; form-action 'self';" always;
    }

    # Proxy API to backend
    # Use variable + resolver to force DNS re-resolution (Docker embedded DNS: 127.0.0.11)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:4000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Un add_header local annule l'héritage des headers du bloc server :
        # re-déclarer ceux qui restent pertinents pour des assets statiques
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
